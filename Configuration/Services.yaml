services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Ameos\AmeosForm\:
    resource: '../Classes/*'
    # Value objects / runtime-instantiated classes (created with constructor arguments, not services)
    exclude:
      - '../Classes/{Constraints,Domain,Elements,Enum,Event,Exception,Utility,Widgets}/*'
      - '../Classes/Form/Form.php'
      - '../Classes/ErrorManager.php'

  # Public so it can also be fetched with GeneralUtility::makeInstance() by consumers
  Ameos\AmeosForm\Service\FormService:
    public: true

  # Event listeners are registered with the #[AsEventListener] attribute
